[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-roi-toolkit"
version = "0.1.0"
description = "Data model, validation, import/export and concentration-risk analytics for the DORA Register of Information (Regulation (EU) 2022/2554)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DORA RoI Toolkit contributors" }]
keywords = ["DORA", "register of information", "ICT third-party risk", "xBRL-CSV", "GRC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "click>=8.1",
    "jinja2>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it to block XML entity attacks (BACKLOG B-07)
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "dora-roi-toolkit[web]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-openpyxl",
    "playwright>=1.45",
]

[project.scripts]
roi = "dora_roi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dora_roi = ["py.typed", "reporting/templates/*.j2", "web/templates/*.j2", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests (Playwright; skipped when no browser is available)"]

[tool.coverage.run]
source = ["dora_roi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/dora_roi"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PTH", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["dora_roi"]
known-local-folder = ["conftest"]
