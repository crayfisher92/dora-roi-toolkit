# CI only: the team stack of docker-compose.yml with a mock Entra ID instead of the real one.
#
#   echo "127.0.0.1 mock-oidc" | sudo tee -a /etc/hosts      # browser and proxy: same issuer
#   OAUTH2_PROXY_COOKIE_SECRET=$(python -c "import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())") #     docker compose -f docker-compose.yml -f compose.ci-mock.yml up -d
#   python ../../scripts/sso_check.py http://localhost:4180 --expect-user anna.muster@example.com
#
# oauth2-proxy runs with the production settings (provider entra-id, PKCE, cookie flags); the
# mock (navikt/mock-oauth2-server) signs a user in without a login page and issues an ID
# token with Entra ID claims (tid, oid, preferred_username, email). NEVER use it outside CI.
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    hostname: mock-oidc
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": false,
         "tokenCallbacks": [{"issuerId": "entra", "tokenExpiry": 3600,
           "requestMappings": [{"requestParam": "code", "match": "*", "claims": {
             "sub": "ci-user-anna", "oid": "11111111-2222-3333-4444-555555555555",
             "tid": "00000000-0000-0000-0000-0000000000c1", "aud": ["roi-ci"],
             "preferred_username": "anna.muster@example.com",
             "email": "anna.muster@example.com", "name": "Anna Muster"}}]}]}
    networks:
      roi:
        ipv4_address: 172.28.0.30

  oauth2-proxy:
    depends_on: [mock-oidc]
    ports: !override
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://mock-oidc:8080/entra
      OAUTH2_PROXY_CLIENT_ID: roi-ci
      OAUTH2_PROXY_CLIENT_SECRET: ci-secret
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: example.com

  workbench:
    image: dora-roi-toolkit:ci
    pull_policy: never
