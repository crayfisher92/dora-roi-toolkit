# DORA RoI Workbench for a team: oauth2-proxy (Microsoft Entra ID) in front of the workbench.
# See docs/TEAM_DEPLOYMENT.md.   Start:  docker compose --env-file .env up -d
#
# Only oauth2-proxy is reachable (port 4180 – put TLS in front of it). The workbench publishes
# no port and trusts the identity header only from oauth2-proxy's fixed address.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1   # check for a newer release before use
    restart: unless-stopped
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-*}
      # OAUTH2_PROXY_ALLOWED_GROUPS: ${ENTRA_ALLOWED_GROUP_ID}   # optional: one Entra group
      OAUTH2_PROXY_UPSTREAMS: http://workbench:8000/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"      # X-Forwarded-User / X-Forwarded-Email
      OAUTH2_PROXY_REVERSE_PROXY: "true"          # TLS is terminated in front of the proxy
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks:
      roi:
        ipv4_address: 172.28.0.10

  workbench:
    build: ../..
    image: dora-roi-toolkit:latest
    restart: unless-stopped
    environment:
      ROI_AUTH_HEADER: X-Forwarded-Email
      ROI_TRUSTED_PROXIES: 172.28.0.10            # oauth2-proxy only
      ROI_PROJECTS_DIR: /data
      ROI_MAX_WORKSPACES: "60"
      ROI_MAX_STORE_ROWS: "1500000"               # about 3 GB – size the container accordingly
    volumes:
      - roi-projects:/data                        # confidential: encrypt and back up
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      roi:
        ipv4_address: 172.28.0.20

networks:
  roi:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  roi-projects: {}
