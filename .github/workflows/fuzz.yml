# Long fuzz run of the parsers for untrusted files (tests/test_fuzz.py, 1 500 examples each).
# Every push and pull request runs the same tests with 25 examples as part of CI.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz the file parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install the locked dependencies
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Fuzz (falsifying examples are printed and saved to .hypothesis/)
        env:
          HYPOTHESIS_PROFILE: fuzz
        run: pytest tests/test_fuzz.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: hypothesis-examples
          path: .hypothesis/
          retention-days: 30
