# Release: push a version tag (vMAJOR.MINOR.PATCH) on main → tests, wheel + sdist,
# multi-architecture Docker image on GHCR, GitHub release with the CHANGELOG notes.
# A manual run (workflow_dispatch) rebuilds an existing tag; it publishes only when asked.
# Procedure: docs/RELEASING.md
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
      publish:
        description: "Publish the GitHub release and push the image"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  ci:
    name: CI on the tag
    # exactly the checks of every push and pull request (lint, types, security, locks, tests on
    # 3.11-3.13, CLI smoke test, scale test, browser and accessibility tests, package, Docker)
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  verify:
    name: Verify version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag matches the package version; changelog has notes
        id: version
        run: |
          python scripts/release_notes.py --check "$TAG" > release-notes.md
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  python-package:
    name: Wheel and sdist
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pkg/bin/roi --version | grep -F "${{ needs.verify.outputs.version }}"
          /tmp/pkg/bin/roi sample s.xlsx
          /tmp/pkg/bin/roi validate s.xlsx --fail-on never
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  docker-image:
    name: Docker image (linux/amd64, linux/arm64)
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          flavor: latest=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: dora-roi-toolkit:release-test
      - name: Smoke test (read-only, no capabilities, non-root)
        run: scripts/docker_smoke.sh dora-roi-toolkit:release-test
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push) the multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  github-release:
    name: GitHub release
    needs: [verify, ci, python-package, docker-image]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only what the release needs: CI uploads further artifacts (screenshots, ZAP and
      # self-test reports, Docker build records) that must not block the release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: artifacts/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: artifacts/release-notes
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # the wheel carries the normalised version (0.2.0rc1 for 0.2.0-rc.1)
          wheel="$(basename artifacts/dist/*.whl)"
          {
            cat artifacts/release-notes/release-notes.md
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "pip install \"${wheel}[web,pdf]\""
            echo "docker run --rm -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp ghcr.io/${GH_REPO}:${VERSION}"
            echo '```'
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/dist/* --verify-tag --title "v${VERSION}" \
              --notes-file notes.md "${flags[@]}"
          fi
