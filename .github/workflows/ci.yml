name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy

  security:
    name: Security scans (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Freeze the runtime + web dependency set in an isolated venv
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --upgrade pip
          /tmp/runtime/bin/pip install ".[web]"
          /tmp/runtime/bin/pip freeze --exclude-editable | grep -vi '^dora-roi-toolkit' > runtime-requirements.txt
          cat runtime-requirements.txt
      - run: pip install pip-audit bandit
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r runtime-requirements.txt --no-deps --progress-spinner off
      - name: Static analysis (bandit, fail on medium+)
        run: bandit -r src --severity-level medium --confidence-level medium

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest --cov=dora_roi --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: CLI smoke test
        run: |
          roi sample out/sample.xlsx
          roi validate out/sample.xlsx --format json -o out/validation.json --fail-on never
          roi report out/sample.xlsx -o out/executive.html --validation-report out/validation.html
          roi sample out/clean --format csv --clean
          roi validate out/clean
          roi export out/clean -o out/package --strict
          roi template out/blank.xlsx
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sample-reports
          path: out/
          retention-days: 7

  e2e:
    name: Browser end-to-end and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save axe-core@4.10.3
      - name: Playwright + axe-core (WCAG 2.2 AA)
        env:
          E2E_REQUIRED: "1"
        run: pytest tests/e2e -v
      - name: Screenshots
        run: python scripts/make_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dora-roi-toolkit:ci .
      - name: Smoke test (read-only, no capabilities, non-root)
        run: |
          docker run -d --name roi -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true dora-roi-toolkit:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS -o /dev/null -X POST -d variant=dirty http://127.0.0.1:8000/sample -w "%{http_code}\n" | grep 303
          test "$(docker exec roi whoami)" = "roi"
          docker logs roi
