name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # the release workflow runs exactly these checks on the release tag
    inputs:
      ref:
        description: "Git ref to check out (default: the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install the locked dependencies
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy (strict)
        run: mypy

  security:
    name: Security scans (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install pip-audit bandit
      - name: Dependency vulnerabilities (pip-audit, locked runtime set)
        run: pip-audit -r requirements/runtime.txt --require-hashes --disable-pip --progress-spinner off
      - name: Static analysis (bandit, fail on medium+)
        run: bandit -r src --severity-level medium --confidence-level medium

  locks:
    name: Dependency locks up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.17
      - name: requirements/ matches pyproject.toml (run scripts/lock.sh after changing it)
        run: sh scripts/lock.sh && git diff --exit-code requirements/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: System libraries for PDF reports (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install the locked dependencies
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Pytest with coverage
        run: pytest --cov=dora_roi --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: CLI smoke test
        run: |
          roi sample out/sample.xlsx
          roi validate out/sample.xlsx --format json -o out/validation.json --fail-on never
          roi report out/sample.xlsx -o out/executive.html --validation-report out/validation.html
          roi sample out/clean --format csv --clean
          roi validate out/clean
          roi export out/clean -o out/package --strict
          roi template out/blank.xlsx
          roi sample out/alpenrand.xlsx --assessments out/assessments.json --incidents out/incidents.json --contract-document out/contract.pdf
          roi contracts assess out/alpenrand.xlsx --assessments out/assessments.json -o out/plan.xlsx
          roi contracts suggest out/contract.pdf -o out/draft.json
          roi incidents summary out/incidents.json --register out/alpenrand.xlsx -o out/incidents.html
          roi finma out/alpenrand.xlsx --assessments out/assessments.json -f json -o out/finma.json
          roi readiness out/alpenrand.xlsx --assessments out/assessments.json --incidents out/incidents.json -o out/readiness.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: matrix.python-version == '3.12'
        with:
          name: sample-reports
          path: out/
          retention-days: 7

  performance:
    name: Scale test (10 000 contracts, 1 000 providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install the locked dependencies
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      # budget is generous for shared CI runners; docs/PERFORMANCE.md has reference timings
      - run: python scripts/profile_large.py --budget 12

  e2e:
    name: Browser end-to-end and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Install the locked dependencies
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save axe-core@4.10.3
      - name: Playwright + axe-core (WCAG 2.2 AA)
        env:
          E2E_REQUIRED: "1"
        run: pytest tests/e2e -v
      - name: Screenshots
        run: python scripts/make_screenshots.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7

  package:
    name: Package (wheel + sdist, install check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pkg/bin/roi --version
          /tmp/pkg/bin/roi sample s.xlsx
          /tmp/pkg/bin/roi validate s.xlsx --fail-on never
      - name: Changelog has notes for this version
        run: python scripts/release_notes.py "$(python -c 'import sys; sys.path.insert(0, "src"); import dora_roi; print(dora_roi.__version__)')" > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: docker build -t dora-roi-toolkit:ci .
      - name: Smoke test (read-only, no capabilities, non-root)
        run: scripts/docker_smoke.sh dora-roi-toolkit:ci

  dast:
    name: Security self-test, ZAP scan and sign-in (oauth2-proxy + mock Entra ID)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: docker build -t dora-roi-toolkit:ci .
      - name: Start the workbench (local mode, hardened container)
        run: |
          docker run -d --name roi -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true dora-roi-toolkit:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Security self-test (local mode)
        run: python3 scripts/security_selftest.py http://127.0.0.1:8000 --report selftest-local.md
      - name: OWASP ZAP baseline scan (fails on the rules marked FAIL in .zap/rules.tsv)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: http://127.0.0.1:8000/
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Stop the local-mode container
        if: always()
        run: docker rm -f roi
      - name: Start the team stack with a mock Entra ID
        working-directory: deploy/team
        run: |
          echo "127.0.0.1 mock-oidc" | sudo tee -a /etc/hosts
          export OAUTH2_PROXY_COOKIE_SECRET="$(python3 -c 'import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          docker compose -f docker-compose.yml -f compose.ci-mock.yml up -d
          for _ in $(seq 1 60); do curl -fsS http://localhost:4180/ping && break; sleep 1; done
      - name: Sign-in end to end (authorisation code flow through oauth2-proxy)
        run: python3 scripts/sso_check.py http://localhost:4180 --expect-user anna.muster@example.com
      - name: Security self-test (team mode, public address)
        run: python3 scripts/security_selftest.py http://localhost:4180 --team --report selftest-team.md
      - name: The workbench container publishes no port
        run: "! curl -fsS --max-time 3 http://127.0.0.1:8000/api/health"
      - name: Logs
        if: failure()
        working-directory: deploy/team
        run: docker compose -f docker-compose.yml -f compose.ci-mock.yml logs --tail 80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: security-selftest
          path: selftest-*.md
          retention-days: 30
